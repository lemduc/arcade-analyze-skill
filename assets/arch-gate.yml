# Architecture gate — like SonarQube, but for architecture.
#
# Copy this to .github/workflows/arch-gate.yml in your repo. It recovers the
# architecture on every PR and fails the check if your .arcade-rules.json is
# violated (cycles, forbidden dependencies, metric floors, oversized components,
# bottlenecks). Add a .arcade-rules.json to your repo root first — see
# arcade-rules.sample.json.
#
# The skill's scripts resolve arcade-agent from a *source checkout* — they put
# <ARCADE_AGENT_HOME>/src on sys.path themselves. So this workflow checks
# arcade-agent out at a pinned tag and installs it from that tree: the checkout
# satisfies the layout, the install supplies the deps (tree-sitter, networkx,
# scipy, numpy, jinja2). A bare `pip install arcade-agent` is not enough on its
# own, because there'd be no <home>/src for the scripts to point at.

name: Architecture gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  arch-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out arcade-agent (pinned)
        uses: actions/checkout@v4
        with:
          repository: lemduc/arcade-agent
          ref: v0.2.0
          path: .arcade-agent

      - name: Install arcade-agent and its parsers
        run: |
          python -m pip install --upgrade pip
          # The [languages] extra pulls the tree-sitter grammars for Kotlin,
          # TypeScript, Go, and C/C++. Drop it if you only analyze Java/Python.
          pip install "./.arcade-agent[languages]"

      - name: Check out the arcade-analyze skill (for the validate script)
        uses: actions/checkout@v4
        with:
          repository: lemduc/arcade-analyze-skill
          path: .arcade-skill

      - name: Validate architecture against rules
        env:
          # Must be the arcade-agent *source checkout* — the skill's scripts add
          # <home>/src to sys.path rather than relying on the installed package.
          ARCADE_AGENT_HOME: ${{ github.workspace }}/.arcade-agent
        run: |
          python .arcade-skill/scripts/validate.py "${{ github.workspace }}" \
            --rules "${{ github.workspace }}/.arcade-rules.json" \
            --fail-on error
